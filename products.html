<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ShipNavi 商品管理プロトタイプ" />
  <title>商品管理 | ShipNavi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/dashboard.css" />
</head>
<body class="app-body" data-page="products">
  <div class="app-shell">
    <aside class="app-sidebar">
      <a class="logo" href="/" aria-label="ShipNavi ホーム"><span class="logo-mark">S</span><span>ShipNavi</span></a>
      <button class="nav-toggle app-menu-toggle" type="button" aria-expanded="false" aria-controls="app-menu"><span class="sr-only">メニューを開閉</span><span></span><span></span><span></span></button>
      <nav class="sidebar-menu" id="app-menu" aria-label="ダッシュボードナビゲーション"><a href="dashboard.html" class="">Dashboard</a><a href="products.html" class="active">商品管理</a><a href="carriers.html" class="">配送会社</a><a href="orders.html" class="">注文取込</a><a href="templates.html" class="">CSVテンプレート</a><a href="results.html" class="">結果センター</a><a href="settings.html" class="">設定</a></nav>
    </aside>
    <main class="app-main">
      <header class="app-topbar">
        <div><p class="eyebrow">ShipNavi Prototype</p><h1>商品管理</h1><p>商品マスタを追加・編集・削除し、CSVで一括取込できます。</p></div>
        <div class="topbar-actions"><a class="button secondary" href="/">公式サイトへ戻る</a></div>
      </header>
      <div class="dashboard-grid"><section class="form-card full-width"><h2>商品を追加・編集</h2><form id="product-form"><input type="hidden" name="id" /><div class="form-grid"><label class="input-group">SKU<input name="sku" required placeholder="SKU-001" /></label><label class="input-group">商品名<input name="name" required placeholder="軽量ジャケット" /></label><label class="input-group">サイズ<select name="size" required><option value="60">60</option><option value="80">80</option><option value="100">100</option><option value="120">120</option><option value="140">140</option></select></label><label class="input-group">重量(g)<input name="weight" type="number" min="1" required placeholder="450" /></label><label class="input-group">長さ(cm)<input name="length" type="number" min="1" required placeholder="30" /></label><label class="input-group">幅(cm)<input name="width" type="number" min="1" required placeholder="20" /></label><label class="input-group">高さ(cm)<input name="height" type="number" min="1" required placeholder="8" /></label><label class="input-group">可否同梱<select name="bundleable" required><option value="可">可</option><option value="不可">不可</option></select></label></div><button class="button primary" type="submit">保存する</button></form></section><section class="upload-card full-width"><h2>CSV取込</h2><form id="product-import-form"><label class="file-drop"><span>商品CSVを選択してください（sku,name,size,weight,length,width,height,bundleable）</span><input type="file" accept=".csv,text/csv" name="file" /></label><button class="button secondary" type="submit">CSVを取り込む</button></form></section><section class="table-card full-width"><div class="table-toolbar"><h2>商品一覧</h2><input class="search-input" id="product-search" placeholder="SKU・商品名で検索" /></div><div class="responsive-table"><table><thead><tr><th>SKU</th><th>商品名</th><th>サイズ</th><th>重量</th><th>長</th><th>幅</th><th>高</th><th>同梱</th><th>操作</th></tr></thead><tbody id="products-table"></tbody></table></div></section></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/dashboard.js"></script>
</body>
</html>
